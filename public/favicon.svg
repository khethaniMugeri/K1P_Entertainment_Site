<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="K1P Entertainment">
  <!-- Black rounded tile (brand base) -->
  <rect width="32" height="32" rx="6" fill="#0A0A0A"/>
  <!-- Vinyl disc: faint groove rings -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#222222" stroke-width="1"/>
  <!-- Red K1P label -->
  <circle cx="16" cy="16" r="5" fill="#E10600"/>
  <!-- Spindle hole -->
  <circle cx="16" cy="16" r="1.3" fill="#0A0A0A"/>
</svg>
